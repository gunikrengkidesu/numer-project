databases:
  - name: numerical-db
    databaseName: numerical
    user: numerical
    region: singapore
    plan: free            
services:
  - type: web
    name: numerical-methods
    runtime: node
    region: singapore    
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: node server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: numerical-db
          property: connectionString
